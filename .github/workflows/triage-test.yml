name: Triage tests

on:
  push:
    paths: ['.github/triage/**', '.github/workflows/triage-test.yml']
  pull_request:
    paths: ['.github/triage/**', '.github/workflows/triage-test.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        working-directory: .github/triage
        run: npm test
